
[200~<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queen Vault | Catálogo & Postulación</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #141418;
      --border: #27272f;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --ok: #10b981;
      --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .wrap { max-width: 980px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5px; }
    .brand span { color: var(--accent); }
    .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 11px 18px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px; margin-bottom: 36px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .card img { width: 100%; height: 240px; object-fit: cover; background: #1c1c22; }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .badge {
      display: inline-block; width: fit-content; font-size: 0.75rem; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; background: rgba(225, 29, 72, 0.18); color: #fda4af;
    }
    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; max-width: 560px; margin: 0 auto;
    }
    .panel h2 { font-size: 1.25rem; margin-bottom: 6px; }
    .panel p.sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
    .field input[type="text"],
    .field input[type="tel"],
    .field input[type="file"] {
      width: 100%; background: #0d0d10; border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font-size: 0.95rem;
    }
    .checks { display: flex; flex-wrap: wrap; gap: 10px; }
    .checks label {
      display: flex; align-items: center; gap: 6px; font-weight: 500;
      background: #0d0d10; border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; cursor: pointer;
    }
    .preview-box { margin-top: 10px; display: none; }
    .preview-box img { max-height: 180px; border-radius: 10px; border: 1px solid var(--border); }
    .msg { margin-top: 14px; font-size: 0.9rem; line-height: 1.45; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .wa-link {
      display: inline-block; margin-top: 10px; background: #16a34a; color: #fff;
      text-decoration: none; font-weight: 700; padding: 10px 14px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">QUEEN <span>VAULT</span></div>
      <a href="#postularme" class="btn" style="text-decoration:none;">Postularme (+18)</a>
    </header>

    <section>
      <h2 style="margin-bottom:14px; font-size:1.15rem;">Catálogo Activo</h2>
      <div id="catalogo" class="grid"></div>
    </section>

    <section id="postularme" class="panel">
      <h2>Postulación de Participantes</h2>
      <p class="sub">Completa tus datos y sube tu foto de portada para iniciar tu revisión.</p>

      <form id="formPostulacion">
        <div class="field">
          <label for="alias">Alias artístico *</label>
          <input id="alias" type="text" required placeholder="Ej. Valentina VIP" />
        </div>

        <div class="field">
          <label for="pais">País *</label>
          <input id="pais" type="text" required placeholder="Ej. Venezuela" />
        </div>

        <div class="field">
          <label for="whatsapp">WhatsApp de contacto (con código de país) *</label>
          <input id="whatsapp" type="tel" required placeholder="Ej. 584121234567" />
        </div>

        <div class="field">
          <label>Modalidades</label>
          <div class="checks">
            <label><input type="checkbox" name="mod" value="Sets Privados" /> Sets Privados</label>
            <label><input type="checkbox" name="mod" value="Videos VIP" /> Videos VIP</label>
            <label><input type="checkbox" name="mod" value="Videollamada" /> Videollamada</label>
            <label><input type="checkbox" name="mod" value="Contenido Personalizado" /> Personalizado</label>
          </div>
        </div>

        <div class="field">
          <label for="foto">Foto de portada *</label>
          <input id="foto" type="file" accept="image/*" required />
          <div id="previewBox" class="preview-box">
            <img id="previewImg" alt="Vista previa" />
          </div>
        </div>

        <button id="btnEnviar" type="submit" class="btn" style="width:100%;">Enviar Postulación</button>
        <div id="estadoEnvio" class="msg"></div>
      </form>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://dfgbmwgmghbfkitutxai.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-CDM2ydv83JLltbTK_mXtw_Qfqhp_9R";
    const BUCKET_FOTOS = "portadas-participantes";
    const ADMIN_WHATSAPP = "584166978426";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const catalogoEl = document.getElementById("catalogo");
    const formEl = document.getElementById("formPostulacion");
    const fotoInput = document.getElementById("foto");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");
    const estadoEl = document.getElementById("estadoEnvio");
    const btnEnviar = document.getElementById("btnEnviar");

    fotoInput.addEventListener("change", () => {
      const file = fotoInput.files[0];
      if (!file) {
        previewBox.style.display = "none";
        return;
      }
      previewImg.src = URL.createObjectURL(file);
      previewBox.style.display = "block";
    });

    async function cargarCatalogo() {
      const { data, error } = await sb
        .from("creadoras")
        .select("*")
        .eq("activa", true);

      if (error || !data || data.length === 0) {
        catalogoEl.innerHTML = `
          <div class="card">
            <div class="card-body">
              <span class="badge">QUEEN VAULT</span>
              <strong>Catálogo en preparación</strong>
              <span style="color:#a1a1aa; font-size:0.85rem;">Las primeras creadoras aprobadas aparecerán aquí.</span>
            </div>
          </div>
        `;
        return;
      }

      catalogoEl.innerHTML = data.map((c) => `
        <div class="card">
          <img src="${c.foto_url || ""}" alt="${c.alias || "Creadora"}" />
          <div class="card-body">
            <span class="badge">${c.estado_perfil || "Activa"}</span>
            <strong>${c.alias || "Perfil"}</strong>
            <span style="color:#a1a1aa; font-size:0.85rem;">${c.pais || ""}</span>
          </div>
        </div>
      `).join("");
    }

    function limpiarTelefono(num) {
      return (num || "").replace(/\D/g, "");
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      estadoEl.className = "msg";
      estadoEl.textContent = "Subiendo foto y registrando postulación...";
      btnEnviar.disabled = true;

      try {
        const alias = document.getElementById("alias").value.trim();
        const pais = document.getElementById("pais").value.trim();
        const whatsappRaw = document.getElementById("whatsapp").value.trim();
        const whatsappLimpio = limpiarTelefono(whatsappRaw);
        const modalidades = Array.from(document.querySelectorAll('input[name="mod"]:checked')).map((el) => el.value);
        const archivo = fotoInput.files[0];

        if (!archivo) throw new Error("Debes seleccionar una foto de portada.");
        if (!whatsappLimpio) throw new Error("Ingresa un número de WhatsApp válido.");

        const ext = (archivo.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        const nombreArchivo = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext || "jpg"}`;

        const { error: uploadError } = await sb.storage
          .from(BUCKET_FOTOS)
          .upload(nombreArchivo, archivo, { cacheControl: "3600", upsert: false });

        if (uploadError) throw new Error("Error al subir la foto: " + uploadError.message);

        const { data: pubData } = sb.storage.from(BUCKET_FOTOS).getPublicUrl(nombreArchivo);
        const fotoUrl = pubData.publicUrl;

        const { error: insertError } = await sb
          .from("participantes")
          .insert([{
            alias_artistico: alias,
            pais: pais,
            whatsapp_contacto: whatsappLimpio,
            modalidades: modalidades,
            foto_url: fotoUrl,
            estado_postulacion: "Pendiente",
            publicada_en_catalogo: false
          }]);

        if (insertError) throw new Error("Error al guardar postulación: " + insertError.message);

        const textoAdmin = encodeURIComponent(
          `👑 NUEVA POSTULACIÓN - QUEEN VAULT\n` +
          `• Alias: ${alias}\n` +
          `• País: ${pais}\n` +
          `• WhatsApp Creadora: https://wa.me/${whatsappLimpio}\n` +
          `• Modalidades: ${modalidades.length ? modalidades.join(", ") : "No especificadas"}\n` +
          `• Foto: ${fotoUrl}\n\n` +
          `Acción: Revisar foto para APROBAR o enviar a NUEVO INGRESO.`
        );
        const linkAvisoAdmin = `https://wa.me/${ADMIN_WHATSAPP}?text=${textoAdmin}`;

        estadoEl.className = "msg ok";
        estadoEl.innerHTML = `
          ¡Postulación enviada con éxito! Tu foto ya quedó cargada y tu perfil está en revisión.<br/>
          <a class="wa-link" href="${linkAvisoAdmin}" target="_blank" rel="noopener">Notificar / Abrir WhatsApp</a>
        `;
        formEl.reset();
        previewBox.style.display = "none";
      } catch (err) {
        estadoEl.className = "msg err";
        estadoEl.textContent = err.message || "Ocurrió un error al enviar.";
      } finally {
        btnEnviar.disabled = false;
      }
    });

    cargarCatalogo();
  </script>
</body>
</html>
