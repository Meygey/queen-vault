<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queen Vault</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #070709;
      --surface: #111115;
      --surface-2: #18181f;
      --border: #262630;
      --text: #f5f5f7;
      --muted: #9e9ea8;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --ok: #10b981;
      --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 18px; }
    .container { max-width: 960px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; margin-bottom: 22px;
    }
    .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.6px; }
    .logo span { color: var(--accent); }
    .btn-postular {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 10px 16px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .btn-postular:hover { background: var(--accent-hover); }
    .section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    .card img { width: 100%; height: 230px; object-fit: cover; display: block; background: var(--surface-2); }
    .card-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .tag {
      display: inline-block; width: fit-content; font-size: 0.72rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; background: rgba(225, 29, 72, 0.16); color: #fda4af;
    }
    .modal-box {
      display: none; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-top: 10px;
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; gap: 10px;
    }
    .btn-cerrar {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
    .field input[type="text"],
    .field input[type="tel"],
    .field input[type="file"] {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem;
    }
    .mods { display: flex; flex-wrap: wrap; gap: 8px; }
    .mods label {
      display: flex; align-items: center; gap: 6px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px;
      font-size: 0.85rem; cursor: pointer;
    }
    .preview { display: none; margin-top: 10px; }
    .preview img { max-height: 170px; border-radius: 10px; border: 1px solid var(--border); }
    .btn-submit {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    .btn-submit:hover { background: var(--accent-hover); }
    .status { margin-top: 12px; font-size: 0.9rem; line-height: 1.45; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .wa-btn {
      display: inline-block; margin-top: 8px; background: #16a34a; color: #fff;
      text-decoration: none; font-weight: 700; padding: 9px 14px; border-radius: 9px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">QUEEN <span>VAULT</span></div>
      <button id="btnAbrirForm" type="button" class="btn-postular">Postulación (+18)</button>
    </div>

    <div class="section-title">Catálogo</div>
    <div id="catalogo" class="grid"></div>

    <div id="seccionPostulacion" class="modal-box">
      <div class="modal-head">
        <h3>Postulación de Participantes</h3>
        <button id="btnCerrarForm" type="button" class="btn-cerrar">Cerrar</button>
      </div>

      <form id="formPostulacion">
        <div class="field">
          <label for="alias">Alias artístico *</label>
          <input id="alias" type="text" required placeholder="Ej. Valentina VIP" />
        </div>

        <div class="field">
          <label for="pais">País *</label>
          <input id="pais" type="text" required placeholder="Ej. Venezuela" />
        </div>

        <div class="field">
          <label for="whatsapp">WhatsApp de contacto (con código de país) *</label>
          <input id="whatsapp" type="tel" required placeholder="Ej. 584121234567" />
        </div>

        <div class="field">
          <label>Modalidades</label>
          <div class="mods">
            <label><input type="checkbox" name="mod" value="Sets Privados" /> Sets Privados</label>
            <label><input type="checkbox" name="mod" value="Videos VIP" /> Videos VIP</label>
            <label><input type="checkbox" name="mod" value="Videollamada" /> Videollamada</label>
            <label><input type="checkbox" name="mod" value="Contenido Personalizado" /> Personalizado</label>
          </div>
        </div>

        <div class="field">
          <label for="foto">Foto de portada *</label>
          <input id="foto" type="file" accept="image/*" required />
          <div id="preview" class="preview">
            <img id="previewImg" alt="Vista previa" />
          </div>
        </div>

        <button id="btnEnviar" type="submit" class="btn-submit">Enviar Postulación</button>
        <div id="estado" class="status"></div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dfgbmwgmghbfkitutxai.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-CDM2ydv83JLltbTK_mXtw_Qfqhp_9R";
    const BUCKET = "portadas-participantes";
    const ADMIN_WA = "584166978426";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btnAbrir = document.getElementById("btnAbrirForm");
    const btnCerrar = document.getElementById("btnCerrarForm");
    const seccionForm = document.getElementById("seccionPostulacion");
    const catalogo = document.getElementById("catalogo");
    const form = document.getElementById("formPostulacion");
    const fotoInput = document.getElementById("foto");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const estado = document.getElementById("estado");
    const btnEnviar = document.getElementById("btnEnviar");

    btnAbrir.addEventListener("click", () => {
      seccionForm.style.display = "block";
      seccionForm.scrollIntoView({ behavior: "smooth" });
    });

    btnCerrar.addEventListener("click", () => {
      seccionForm.style.display = "none";
    });

    fotoInput.addEventListener("change", () => {
      const f = fotoInput.files[0];
      if (!f) {
        preview.style.display = "none";
        return;
      }
      previewImg.src = URL.createObjectURL(f);
      preview.style.display = "block";
    });

    function limpiarTel(v) {
      return (v || "").replace(/\D/g, "");
    }

    async function cargarCatalogo() {
      const { data, error } = await sb.from("creadoras").select("*").eq("activa", true);
      if (error || !data || data.length === 0) {
        catalogo.innerHTML = `
          <div class="card">
            <div class="card-info">
              <span class="tag">QUEEN VAULT</span>
              <strong>Perfiles en preparación</strong>
              <span style="color:#9e9ea8;font-size:0.84rem;">Toca Postulación (+18) para enviar tu solicitud.</span>
            </div>
          </div>
        `;
        return;
      }
      catalogo.innerHTML = data.map((c) => `
        <div class="card">
          <img src="${c.foto_url || ""}" alt="${c.alias || "Perfil"}" />
          <div class="card-info">
            <span class="tag">${c.estado_perfil || "Activo"}</span>
            <strong>${c.alias || "Perfil"}</strong>
            <span style="color:#9e9ea8;font-size:0.84rem;">${c.pais || ""}</span>
          </div>
        </div>
      `).join("");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      estado.className = "status";
      estado.textContent = "Subiendo foto y guardando postulación...";
      btnEnviar.disabled = true;

      try {
        const alias = document.getElementById("alias").value.trim();
        const pais = document.getElementById("pais").value.trim();
        const waLimpio = limpiarTel(document.getElementById("whatsapp").value.trim());
        const mods = Array.from(document.querySelectorAll('input[name="mod"]:checked')).map((i) => i.value);
        const archivo = fotoInput.files[0];

        if (!archivo) throw new Error("Selecciona una foto de portada.");
        if (!waLimpio) throw new Error("Ingresa un número de WhatsApp válido.");

        const ext = (archivo.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        const ruta = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext || "jpg"}`;

        const { error: upErr } = await sb.storage.from(BUCKET).upload(ruta, archivo, {
          cacheControl: "3600",
          upsert: false
        });
        if (upErr) throw new Error("Error subiendo foto: " + upErr.message);

        const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(ruta);
        const fotoUrl = urlData.publicUrl;

        const { error: insErr } = await sb.from("participantes").insert([{
          alias_artistico: alias,
          pais: pais,
          whatsapp_contacto: waLimpio,
          modalidades: mods,
          foto_url: fotoUrl,
          estado_postulacion: "Pendiente",
          publicada_en_catalogo: false
        }]);
        if (insErr) throw new Error("Error guardando postulación: " + insErr.message);

        const msg = encodeURIComponent(
          `👑 NUEVA POSTULACIÓN - QUEEN VAULT
` +
          `• Alias: ${alias}
` +
          `• País: ${pais}
` +
          `• WhatsApp: https://wa.me/${waLimpio}
` +
          `• Modalidades: ${mods.length ? mods.join(", ") : "No especificadas"}
` +
          `• Foto: ${fotoUrl}

` +
          `Revisión: APROBAR o enviar a NUEVO INGRESO.`
        );
        const waLink = `https://wa.me/${ADMIN_WA}?text=${msg}`;

        estado.className = "status ok";
        estado.innerHTML = `
          Postulación enviada con éxito. Tu foto ya quedó subida y está en revisión.<br/>
          <a class="wa-btn" href="${waLink}" target="_blank" rel="noopener">Abrir WhatsApp con datos</a>
        `;
        form.reset();
        preview.style.display = "none";
      } catch (err) {
        estado.className = "status err";
        estado.textContent = err.message || "Error al enviar.";
      } finally {
        btnEnviar.disabled = false;
      }
    });

    cargarCatalogo();
  </script>
</body>
</html>
